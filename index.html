<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Berto Car - Estoque</h2>

        <!--Formulario de cadastro-->
        <div class="form-group">
            <label for="peca">Peça:</label>
            <input type="text" id="peca" placeholder="Ex: Pastilha de freio">
        </div>
         <div class="form-group">
            <label for="qtd">Quantidade:</label>
            <input type="text" id="qtd" placeholder="Ex: 10">
        </div>
         <div class="form-group">
            <label for="preco">Código:</label>
            <input type="text" id="codigo" placeholder="Ex: P001">
        
        <button>Cadastrar peça</button>

        <!--Tabela de estoque-->

        <h3>Peças em Estoque</h3>
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Peça</th>
                    <th>Quantidade</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-estoque">
                <!--Os itens cadastrados apareceram aqui-->
            </tbody>
        </table>
    </div>

<script src="script.js"></script>    

</body>
</html>
